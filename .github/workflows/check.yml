name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type and Astro checks
        run: bun run check
      - name: Unit tests
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Production build
        run: bun run build
